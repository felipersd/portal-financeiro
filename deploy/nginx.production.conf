events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    # Caddy overwrites X-Forwarded-For; only the shared edge network and loopback reach this gateway.
    limit_req_zone $http_x_forwarded_for zone=api:10m rate=15r/s;
    limit_req_status 429;
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    server {
        listen 80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        location = /health/identity {
            set $identity identity-service;
            proxy_pass http://$identity:3001/health;
        }
        location = /health/finance {
            set $finance finance-service;
            proxy_pass http://$finance:3002/health;
        }
        location /api/auth/ {
            limit_req zone=api burst=30 nodelay;
            set $identity identity-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$identity:3001;
        }
        location ~ ^/api/(transactions|categories|members|budget-rules)(/|$) {
            limit_req zone=api burst=30 nodelay;
            set $finance finance-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$finance:3002;
        }
        location /api/ { return 404; }
        location /internal/ { return 404; }
        location / {
            set $frontend frontend;
            proxy_pass http://$frontend:80;
        }
    }
}
