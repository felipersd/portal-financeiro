services:
  identity-service:
    build:
      context: ./apps/backend/identity-service
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma generate && npx prisma db push && npx ts-node-dev --respawn --transpile-only src/server/server.ts"
    ports:
      - 127.0.0.1:3001:3001
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/backend/identity-service/.env.local
    volumes:
      - ./apps/backend/identity-service:/app:delegated
      - /app/node_modules
  finance-service:
    build:
      context: ./apps/backend/finance-service
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma generate && npx prisma db push && npx ts-node-dev --respawn --transpile-only src/server/server.ts"
    ports:
      - 127.0.0.1:3002:3002
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/backend/finance-service/.env.local
    volumes:
      - ./apps/backend/finance-service:/app:delegated
      - /app/node_modules
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_MODE: development
    command: npm run dev -- --host --port 80
    environment:
      VITE_API_PROXY_TARGET: http://gateway
    ports:
      - 127.0.0.1:80:80
    volumes:
      - ./apps/frontend:/app:delegated
      - /app/node_modules
    depends_on:
      - gateway
  gateway:
    image: nginx:alpine
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./apps/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - finance-service
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_db
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  portainer:
    profiles: ["admin"]
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: null
  portainer_data:
networks: {}
