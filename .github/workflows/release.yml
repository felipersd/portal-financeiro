name: Verify and deploy Portal Financeiro
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: finance_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal -d finance_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/identity-service/package-lock.json
            apps/backend/finance-service/package-lock.json
      - name: Frontend checks
        working-directory: apps/frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test -- --run
          npm run build
      - name: Identity checks and migrations
        working-directory: apps/backend/identity-service
        env:
          DATABASE_URL: postgresql://portal:test-only-password@localhost:5432/finance_db?schema=identity
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test -- --runInBand
          npm run db:migrate
          npm run db:migrate
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Finance checks and migrations
        working-directory: apps/backend/finance-service
        env:
          DATABASE_URL: postgresql://portal:test-only-password@localhost:5432/finance_db?schema=finance
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test -- --runInBand
          npm run db:migrate
          npm run db:migrate
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Sharing consent and concurrency integration
        # The PostgreSQL service above is disposable; production credentials are never used here.
        run: |
          cd apps/backend/finance-service
          DATABASE_URL='postgresql://portal:test-only-password@localhost:5432/finance_db?schema=finance' INTEGRATION_TESTS=1 npm test -- --runInBand --testPathPatterns=integration
      - name: Validate deployment configuration
        run: |
          for script in deploy/*.sh apps/backend/*/entrypoint.sh; do bash -n "$script"; done
          bash deploy/tests/rollback-compatibility.sh
          bash deploy/tests/financial-migration.sh
          export IDENTITY_IMAGE=identity:test FINANCE_IMAGE=finance:test FRONTEND_IMAGE=frontend:test GATEWAY_IMAGE=gateway:test
          docker compose --env-file deploy/.env.vps.example -f deploy/compose.vps.yml config --quiet
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      identity: ghcr.io/felipersd/portal-financeiro-identity@${{ steps.identity.outputs.digest }}
      finance: ghcr.io/felipersd/portal-financeiro-finance@${{ steps.finance.outputs.digest }}
      frontend: ghcr.io/felipersd/portal-financeiro-frontend@${{ steps.frontend.outputs.digest }}
      gateway: ghcr.io/felipersd/portal-financeiro-gateway@${{ steps.gateway.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$(cat VERSION)" ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: identity
        with:
          context: apps/backend/identity-service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-identity:${{ github.ref_name }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=identity
          cache-to: type=gha,scope=identity,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: finance
        with:
          context: apps/backend/finance-service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-finance:${{ github.ref_name }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=finance
          cache-to: type=gha,scope=finance,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: frontend
        with:
          context: apps/frontend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-frontend:${{ github.ref_name }}
          build-args: |
            APP_REVISION=${{ github.sha }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: gateway
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-gateway:${{ github.ref_name }}
          provenance: true
          sbom: true
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://portalfinanceiro.net
    permissions:
      contents: read
      packages: read
    concurrency: portal-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Deploy release by digest
        env:
          IDENTITY_IMAGE: ${{ needs.image.outputs.identity }}
          FINANCE_IMAGE: ${{ needs.image.outputs.finance }}
          FRONTEND_IMAGE: ${{ needs.image.outputs.frontend }}
          GATEWAY_IMAGE: ${{ needs.image.outputs.gateway }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/portal
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/portal ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/portal' EXIT
          SSH=(-i ~/.ssh/portal -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          REMOTE="/srv/portal-financeiro/releases/$GITHUB_SHA"
          printf 'IDENTITY_IMAGE=%s\nFINANCE_IMAGE=%s\nFRONTEND_IMAGE=%s\nGATEWAY_IMAGE=%s\n' "$IDENTITY_IMAGE" "$FINANCE_IMAGE" "$FRONTEND_IMAGE" "$GATEWAY_IMAGE" > deploy/images.env
          ssh "${SSH[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE'"
          scp "${SSH[@]}" -r deploy "$VPS_USER@$VPS_HOST:$REMOTE/"
          printf '%s' "$REGISTRY_TOKEN" | ssh "${SSH[@]}" "$VPS_USER@$VPS_HOST" "bash '$REMOTE/deploy/release.sh' '$GITHUB_ACTOR'"
      - name: Verify public release
        if: vars.PUBLIC_DNS_READY == 'true'
        run: |
          curl -fsS --retry 6 --retry-all-errors --max-time 20 https://portalfinanceiro.net/version.json | grep -F "$GITHUB_SHA"
