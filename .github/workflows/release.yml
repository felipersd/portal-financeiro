name: Verify and prepare release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: finance_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal -d finance_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/identity-service/package-lock.json
            apps/backend/finance-service/package-lock.json
      - name: Frontend checks
        working-directory: apps/frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test -- --run
          npm run build
      - name: Identity checks and migrations
        working-directory: apps/backend/identity-service
        env:
          DATABASE_URL: postgresql://portal:test-only-password@localhost:5432/finance_db?schema=identity
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test -- --runInBand
          npm run db:migrate
          npm run db:migrate
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Finance checks and migrations
        working-directory: apps/backend/finance-service
        env:
          DATABASE_URL: postgresql://portal:test-only-password@localhost:5432/finance_db?schema=finance
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          npm test -- --runInBand
          npm run db:migrate
          npm run db:migrate
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Sharing consent and concurrency integration
        # The PostgreSQL service above is disposable; production credentials are never used here.
        run: |
          cd apps/backend/finance-service
          DATABASE_URL='postgresql://portal:test-only-password@localhost:5432/finance_db?schema=finance' INTEGRATION_TESTS=1 npm test -- --runInBand --testPathPatterns=integration
      - name: Validate deployment configuration
        run: |
          for script in deploy/*.sh deploy/tests/*.sh apps/backend/*/entrypoint.sh; do bash -n "$script"; done
          bash deploy/tests/rollback-compatibility.sh
          bash deploy/tests/financial-migration.sh
          node --test deploy/tests/*.test.cjs
          bash deploy/tests/blue-green.sh
          export IDENTITY_IMAGE=identity:test FINANCE_IMAGE=finance:test FRONTEND_IMAGE=frontend:test GATEWAY_IMAGE=gateway:test
          docker compose --env-file deploy/.env.vps.example -f deploy/compose.vps.yml config --quiet
          DEPLOYMENT_SLOT=blue docker compose --env-file deploy/.env.vps.example -f deploy/compose.slot.yml config --quiet
      - name: Verify push secret access with production runtime image
        run: |
          docker build -t portal-finance-runtime:test apps/backend/finance-service
          bash deploy/tests/push-secret.sh portal-finance-runtime:test
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$(cat VERSION)" ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: identity
        with:
          context: apps/backend/identity-service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-identity:${{ github.ref_name }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=identity
          cache-to: type=gha,scope=identity,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: finance
        with:
          context: apps/backend/finance-service
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-finance:${{ github.ref_name }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=finance
          cache-to: type=gha,scope=finance,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: frontend
        with:
          context: apps/frontend
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-frontend:${{ github.ref_name }}
          build-args: |
            APP_REVISION=${{ github.sha }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: true
          sbom: true
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: gateway
        with:
          context: .
          file: deploy/Dockerfile.gateway
          push: true
          platforms: linux/amd64
          tags: ghcr.io/felipersd/portal-financeiro-gateway:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Save immutable release manifest
        env:
          IDENTITY_IMAGE: ghcr.io/felipersd/portal-financeiro-identity@${{ steps.identity.outputs.digest }}
          FINANCE_IMAGE: ghcr.io/felipersd/portal-financeiro-finance@${{ steps.finance.outputs.digest }}
          FRONTEND_IMAGE: ghcr.io/felipersd/portal-financeiro-frontend@${{ steps.frontend.outputs.digest }}
          GATEWAY_IMAGE: ghcr.io/felipersd/portal-financeiro-gateway@${{ steps.gateway.outputs.digest }}
        run: |
          node -e 'const images=Object.fromEntries(["IDENTITY","FINANCE","FRONTEND","GATEWAY"].map(service=>[service+"_IMAGE",process.env[service+"_IMAGE"]])); require("fs").writeFileSync("release.json",JSON.stringify({revision:process.env.GITHUB_SHA,images}));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
